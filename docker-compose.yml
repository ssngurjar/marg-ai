# Local development: Postgres with pgvector plus the api. (The worker joins in S4.)
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: marg
      POSTGRES_PASSWORD: marg
      POSTGRES_DB: marg
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "marg"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://marg:marg@postgres:5432/marg
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata: {}
