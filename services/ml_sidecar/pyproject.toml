[project]
name = "marg-ai-ml-sidecar"
version = "0.1.0"
description = "Marg.ai's ML sidecar: Meta's MMS-TTS speech for voice replies (/tts, s06 §4.9)"
# Its own environment keeps torch out of the API image (CLAUDE.md §8).
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "numpy==2.5.4",
    "pydantic==2.14.1",
    "torch==2.6.0",
    "transformers==4.46.1",
    "uvicorn==0.34.3",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py312"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = ["S101", "PLR2004"]   # the same allowance as the main repo's tests

# The main repo's settings, checked in this environment (it has torch).
[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_unimported = true
disallow_any_explicit = true
disallow_any_decorated = false   # FastAPI decorators are Any-typed internally (decision B7)
warn_unreachable = true
warn_unused_ignores = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
markers = ["unit: pure or fake-backed, no I/O"]
