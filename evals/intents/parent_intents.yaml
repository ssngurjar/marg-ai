# The intent bank: how parents really write and speak to Marg, and what each message means.
# Synthetic (written for this bank, and the owner's own demo messages); no real user's words.
#
# Each case: `text`; `open_khoj` (true: the "Jaanwar ki chaal" khoj is waiting for a report);
# `intent`, one ParentIntent; `asked`, the language asked for, only when the message asks for one.
# Run it live with `.venv/bin/python -m scripts.intent_bank`; `tests/unit/test_intent_bank.py`
# keeps this file valid. Children on the list: Munni (5) and Golu (7).
#
# `lang` is how the case is written, for the per-language table. Optional checks (critic review,
# 2026-11-01): `braj`, `language` (what the words are written in), `child_name`, and `report_about`
# with `other_khojs` (khojs offered lately besides the open one).
# Two things in one message: deletion wins over everything; then a setting (daily time or off);
# then a report over small talk; otherwise what it mainly asks Marg to do now.

