<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marg.ai system diagram</title>
<!--
  The "How it works" diagram for the demo video (video-script.md, 2:06–2:33).
  Open in a browser, full screen (F11 or Ctrl+Cmd+F), and screen-record at 16:9.
  → or Space: next part · ←: back · A: show everything · R: start again
  C: captions on/off (the voice-over line for each part) · H: hide or show the controls
-->
<style>
  :root {
    --ground: #0d1117;
    --card: #161b22;
    --card-line: #3d4652;
    --text: #e6edf3;
    --muted: #9aa7b4;
    --meta: #11284a;
    --meta-line: #4c8dff;
    --meta-chip: #4c8dff;
    --safety: #2b1e08;
    --safety-line: #f0a73a;
    --arrow: #7d8896;
    --glow: #ffffff;
  }
  html, body { margin: 0; height: 100%; background: var(--ground); overflow: hidden; }
  body { font-family: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif; }
  svg.diagram { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  .card { fill: var(--card); stroke: var(--card-line); stroke-width: 2; }
  .meta { fill: var(--meta); stroke: var(--meta-line); stroke-width: 2.5; }
  .band { fill: var(--safety); stroke: var(--safety-line); stroke-width: 2.5; }
  .record { fill: #12181f; stroke: var(--card-line); stroke-width: 2; stroke-dasharray: 8 6; }
  .title { fill: var(--text); font-size: 44px; font-weight: 700; }
  .subtitle { fill: var(--muted); font-size: 24px; }
  .head { fill: var(--text); font-size: 25px; font-weight: 700; }
  .safety-head { fill: var(--safety-line); font-size: 25px; font-weight: 700; }
  .line { fill: var(--muted); font-size: 18px; }
  .line-strong { fill: var(--text); font-size: 18px; font-weight: 600; }
  .chip { fill: var(--meta-chip); }
  .chip-text { fill: #0d1117; font-size: 13px; font-weight: 800; letter-spacing: 1px; }
  .label { fill: var(--muted); font-size: 15px; }
  .arrow { stroke: var(--arrow); stroke-width: 3; fill: none; marker-end: url(#head); }
  .step { opacity: 0; transition: opacity 600ms ease; }
  .step.shown { opacity: 1; }
  .step.new .card, .step.new .meta, .step.new .band, .step.new .record {
    filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.35));
  }
  .ui {
    position: fixed; right: 16px; top: 16px; display: flex; gap: 8px;
    font-size: 14px; color: var(--muted);
  }
  .ui button {
    min-width: 44px; min-height: 44px; padding: 0 14px; border-radius: 8px;
    border: 1px solid var(--card-line); background: var(--card); color: var(--text);
    font: inherit; cursor: pointer;
  }
  .ui .count { align-self: center; padding: 0 6px; }
  .caption {
    position: fixed; left: 50%; bottom: 3vh; transform: translateX(-50%);
    max-width: 80vw; padding: 10px 18px; border-radius: 8px; background: rgba(0, 0, 0, 0.7);
    color: var(--text); font-size: 2.2vh; line-height: 1.35; text-align: center;
  }
  .hidden { display: none; }
</style>
</head>
<body>

<svg class="diagram" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="Marg.ai: a WhatsApp message passes an inbox, speech-to-text, a router (rules for who is talking, Muse Spark for what they mean) and a safety check, is answered by Muse Spark and Muse Spark Open, checked again and sent; photos are checked by SAM 3.1 and khoj cards drawn by Muse Image; every turn adds to one learner record.">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8896"/>
    </marker>
  </defs>

  <!-- Part 1: the people, and WhatsApp -->
  <g class="step" data-step="1">
    <text class="title" x="60" y="92">Marg.ai: how one message travels</text>
    <text class="subtitle" x="60" y="132">From the outside, just a WhatsApp contact</text>

    <rect class="card" x="60" y="180" width="220" height="440" rx="14"/>
    <text class="head" x="80" y="222">People</text>
    <text class="line-strong" x="80" y="268">Parent</text>
    <text class="line" x="80" y="292">of a 3–8-year-old</text>
    <text class="line-strong" x="80" y="340">Child</text>
    <text class="line" x="80" y="364">with the parent's yes</text>
    <text class="line-strong" x="80" y="412">Teacher</text>
    <text class="line" x="80" y="436">today's chapter</text>
    <text class="line-strong" x="80" y="484">Student</text>
    <text class="line" x="80" y="508">class 6–12</text>
    <text class="line" x="80" y="566">WhatsApp or web</text>
    <text class="line" x="80" y="590">voice · text · photo</text>
  </g>

  <!-- Part 2: the system around the models -->
  <g class="step" data-step="2">
    <text class="subtitle" x="60" y="132" style="opacity:0">.</text>
    <path class="arrow" d="M 284 400 L 324 400"/>
    <rect class="card" x="330" y="330" width="200" height="140" rx="14"/>
    <text class="head" x="350" y="372">Inbox</text>
    <text class="line" x="350" y="404">stored once, &lt; 1 s</text>
    <text class="line" x="350" y="428">one turn at a time</text>
    <text class="line" x="350" y="452">per person</text>

    <path class="arrow" d="M 534 400 L 574 400"/>
    <rect class="card" x="580" y="350" width="250" height="100" rx="14"/>
    <text class="head" x="600" y="388">Router</text>
    <text class="line" x="600" y="416">rules: who is talking</text>
    <text class="line-strong" x="600" y="440">Muse Spark: what's meant</text>

    <path class="arrow" d="M 834 400 L 874 400"/>
    <rect class="band" x="880" y="180" width="200" height="440" rx="14"/>
    <text class="safety-head" x="900" y="222">Safety in</text>

    <path class="arrow" d="M 1084 400 L 1124 400"/>
    <rect class="card" x="1130" y="180" width="280" height="130" rx="14"/>
    <text class="head" x="1150" y="222">Five guides</text>
    <text class="line" x="1150" y="254">khoj · child's question</text>
    <text class="line" x="1150" y="278">child talk · teacher</text>
    <text class="line" x="1150" y="302">student mentor &amp; plan</text>

    <rect class="card" x="1130" y="640" width="280" height="80" rx="14"/>
    <text class="line-strong" x="1150" y="674">50 official sources</text>
    <text class="line" x="1150" y="700">searched, every fact cited</text>

    <path class="arrow" d="M 1414 400 L 1454 400"/>
    <rect class="band" x="1460" y="180" width="170" height="440" rx="14"/>
    <text class="safety-head" x="1480" y="222">Safety out</text>

    <path class="arrow" d="M 1634 400 L 1674 400"/>
    <rect class="card" x="1680" y="330" width="200" height="140" rx="14"/>
    <text class="head" x="1700" y="372">Reply</text>
    <text class="line" x="1700" y="404">Hindi, Hinglish</text>
    <text class="line" x="1700" y="428">or Braj</text>
    <text class="line" x="1700" y="452">sent once</text>

    <path class="arrow" d="M 430 474 L 430 754"/>
    <text class="label" x="442" y="620">every turn</text>
    <rect class="record" x="330" y="760" width="1550" height="100" rx="14"/>
    <text class="head" x="356" y="802">One learner record</text>
    <text class="line" x="356" y="834">a nickname and a birth year, nothing more · from a child's first "why" to their first career decision</text>
  </g>

  <!-- Part 3: Muse Voice Transcribe -->
  <g class="step" data-step="3">
    <rect class="meta" x="580" y="180" width="250" height="140" rx="14"/>
    <rect class="chip" x="600" y="196" width="58" height="22" rx="5"/>
    <text class="chip-text" x="611" y="212">META</text>
    <text class="head" x="600" y="250">Voice Transcribe</text>
    <text class="line" x="600" y="280">hears the voice note</text>
    <text class="line" x="600" y="304">spots Braj</text>
    <path class="arrow" d="M 705 324 L 705 344"/>
  </g>

  <!-- Part 4: Muse Spark 1.3 -->
  <g class="step" data-step="4">
    <rect class="meta" x="1130" y="330" width="280" height="140" rx="14"/>
    <rect class="chip" x="1150" y="346" width="58" height="22" rx="5"/>
    <text class="chip-text" x="1161" y="362">META</text>
    <text class="head" x="1150" y="400">Muse Spark 1.3</text>
    <text class="line" x="1150" y="430">plans the khoj, replies</text>
    <text class="line" x="1150" y="454">in the family's language</text>
    <path class="arrow" d="M 1270 474 L 1270 484" style="opacity:0"/>
  </g>

  <!-- Part 5: Muse Spark Open -->
  <g class="step" data-step="5">
    <rect class="meta" x="1130" y="490" width="280" height="130" rx="14"/>
    <rect class="chip" x="1150" y="506" width="140" height="22" rx="5"/>
    <text class="chip-text" x="1161" y="522">META · OPEN</text>
    <text class="head" x="1150" y="560">Muse Spark Open</text>
    <text class="line" x="1150" y="590">reflects on what the</text>
    <text class="line" x="1150" y="614">child did and said</text>
  </g>

  <!-- Part 6: SAM 3.1 -->
  <g class="step" data-step="6">
    <path class="arrow" d="M 705 454 L 705 474"/>
    <rect class="meta" x="580" y="480" width="250" height="140" rx="14"/>
    <rect class="chip" x="600" y="496" width="58" height="22" rx="5"/>
    <text class="chip-text" x="611" y="512">META</text>
    <text class="head" x="600" y="550">SAM 3.1</text>
    <text class="line" x="600" y="580">a person? photo dropped</text>
    <text class="line" x="600" y="604">else counts the leaves</text>
  </g>

  <!-- Part 7: Muse Image -->
  <g class="step" data-step="7">
    <path class="arrow" d="M 1634 555 L 1674 555"/>
    <rect class="meta" x="1680" y="490" width="200" height="130" rx="14"/>
    <rect class="chip" x="1700" y="506" width="58" height="22" rx="5"/>
    <text class="chip-text" x="1711" y="522">META</text>
    <text class="head" x="1700" y="560">Muse Image</text>
    <text class="line" x="1700" y="590">the khoj card</text>
    <text class="line" x="1700" y="614">to share</text>
  </g>

  <!-- Part 8: safety, both ways -->
  <g class="step" data-step="8">
    <rect class="meta" x="896" y="244" width="168" height="96" rx="10"/>
    <rect class="chip" x="908" y="256" width="58" height="22" rx="5"/>
    <text class="chip-text" x="919" y="272">META</text>
    <text class="line-strong" x="908" y="304">Llama Guard 4</text>
    <text class="line" x="908" y="328">+ Muse Spark</text>
    <text class="line-strong" x="900" y="380">Crisis words</text>
    <text class="line" x="900" y="404">fixed helpline</text>
    <text class="line" x="900" y="428">reply, never AI</text>
    <text class="line-strong" x="900" y="476">Child rules</text>
    <text class="line" x="900" y="500">no hazards, no</text>
    <text class="line" x="900" y="524">secrets</text>
    <text class="line-strong" x="900" y="572">Down?</text>
    <text class="line" x="900" y="596">nothing unchecked</text>

    <rect class="meta" x="1472" y="244" width="146" height="96" rx="10"/>
    <rect class="chip" x="1484" y="256" width="58" height="22" rx="5"/>
    <text class="chip-text" x="1495" y="272">META</text>
    <text class="line-strong" x="1484" y="304">Llama Guard 4</text>
    <text class="line" x="1484" y="328">+ Muse Spark</text>
    <text class="line" x="1480" y="380">every reply</text>
    <text class="line" x="1480" y="404">checked before</text>
    <text class="line" x="1480" y="428">it is sent</text>
    <text class="line" x="1480" y="476">fails closed</text>
  </g>

  <!-- Part 9: the six Meta models -->
  <g class="step" data-step="9">
    <rect class="chip" x="60" y="930" width="58" height="22" rx="5"/>
    <text class="chip-text" x="71" y="946">META</text>
    <text class="line-strong" x="134" y="947">Six Meta models, each with one job: Muse Spark 1.3 · Muse Spark Open · Voice Transcribe · SAM 3.1 · Muse Image · Llama Guard 4</text>
    <text class="line" x="134" y="980">Every model Marg calls is a Meta model. Everything else is rules and code.</text>
  </g>
</svg>

<div class="ui" id="ui">
  <button type="button" id="back" aria-label="Previous part">←</button>
  <span class="count" id="count">1 / 9</span>
  <button type="button" id="next" aria-label="Next part">→</button>
  <button type="button" id="all">All</button>
  <button type="button" id="captions">Captions</button>
</div>
<div class="caption" id="caption"></div>

<script>
  // The voice-over lines of video-script.md (2:06–2:33), one per part.
  // Part 9 has no voice-over: it holds the list of models on screen as the section ends.
  const CAPTIONS = [
    "From the outside, it's just a WhatsApp contact.",
    "Inside, a compound AI system: six Meta models, each with one job.",
    "Voice Transcribe hears the parent.",
    "Muse Spark plans and replies in the family's language.",
    "Muse Spark Open, an open-weights model, reflects on the child.",
    "SAM counts what they collected.",
    "Muse Image draws the card.",
    "Llama Guard 4 checks every message, both ways. If safety is down, nothing goes out.",
    "",
  ];
  const parts = Array.from(document.querySelectorAll(".step"));
  const last = CAPTIONS.length;
  let current = 1;
  let captionsOn = true;

  function show(step) {
    current = Math.max(1, Math.min(last, step));
    for (const part of parts) {
      const at = Number(part.dataset.step);
      part.classList.toggle("shown", at <= current);
      part.classList.toggle("new", at === current);
    }
    document.getElementById("count").textContent = current + " / " + last;
    const caption = document.getElementById("caption");
    caption.textContent = CAPTIONS[current - 1];
    caption.classList.toggle("hidden", !captionsOn || !caption.textContent);
  }

  document.getElementById("next").addEventListener("click", () => show(current + 1));
  document.getElementById("back").addEventListener("click", () => show(current - 1));
  document.getElementById("all").addEventListener("click", () => show(last));
  document.getElementById("captions").addEventListener("click", () => {
    captionsOn = !captionsOn;
    show(current);
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "ArrowRight" || event.key === " ") show(current + 1);
    else if (event.key === "ArrowLeft") show(current - 1);
    else if (event.key === "a" || event.key === "A") show(last);
    else if (event.key === "r" || event.key === "R") show(1);
    else if (event.key === "c" || event.key === "C") { captionsOn = !captionsOn; show(current); }
    else if (event.key === "h" || event.key === "H") document.getElementById("ui").classList.toggle("hidden");
    else return;
    event.preventDefault();
  });
  // system-diagram.html#9 opens at part 9 (here, everything); no number starts at part 1.
  show(Number(location.hash.slice(1)) || 1);
</script>
</body>
</html>
